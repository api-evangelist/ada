- aid: ada:ada-mcp-server
  name: Ada MCP Server
  description: Model Context Protocol server exposing Ada's management surface to AI assistants — metrics, conversation
    transcripts, knowledge and coaching search, entity discovery, test cases and runs, change sets, and staged writes
    to Agent behaviour. Served from the customer's own Ada instance host over JSON-RPC 2.0 (SSE is not supported),
    authenticated by OAuth with dashboard role-based access control, or by API key. Eighteen documented tools plus
    a nine-prompt library.
  humanURL: https://docs.ada.cx/mcp/introduction/overview
  baseURL: https://example.ada.support/api/mcp
  tags:
