openapi: 3.2.0
info:
  title: Knowledge Channels API
  version: 1.0.0
servers:
- url: https://example.ada.support/api
  description: Production
tags:
- name: Channels
paths:
  /v2/channels/:
    get:
      operationId: get-channels
      summary: Get a list of channels
      description: Get a list of channels. This list can be filtered by modality and paginated. The default and maximum limits are 100 channels per page
      tags:
      - Channels
      parameters:
      - name: limit
        in: query
        description: The number of records to return
        required: false
        schema:
          type: integer
      - name: cursor
        in: query
        description: The ID that marks the start or beginning of the returned records
        required: false
        schema:
          type: string
      - name: type
        in: query
        description: The type of the channels to retrieve
        required: true
        schema:
          $ref: '#/components/schemas/V2ChannelsGetParametersType'
      - name: modality
        in: query
        description: The modality of the channels to retrieve
        required: false
        schema:
          $ref: '#/components/schemas/V2ChannelsGetParametersModality'
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Channels
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channels_getChannels_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
    post:
      operationId: create-channel
      summary: Create a new channel
      description: Create a new channel. A maximum of 100 channels can be created per account per day. The maximum request size is 10MB.
      tags:
      - Channels
      parameters:
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Channel created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomChannel'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '413':
          description: Content Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomChannel'
  /v2/channels/{channel_id}:
    patch:
      operationId: update-channel
      summary: Update a channel
      description: Update a channel's capabilities. Only custom channels can be updated; native channels are read-only.
      tags:
      - Channels
      parameters:
      - name: channel_id
        in: path
        description: The ID of the channel to update
        required: true
        schema:
          type: string
          format: id
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Channel updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomChannel'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChannel'
components:
  schemas:
    Channel:
      oneOf:
      - type: object
        properties:
          type:
            $ref: '#/components/schemas/CustomChannelType'
            description: The type of the channel
          id:
            type: string
            format: id
            description: The channel ID
          name:
            type: string
            description: The name of the channel
          description:
            type: string
            description: A description of the channel
          modality:
            $ref: '#/components/schemas/BaseChannelModality'
            description: The modality of the channel
          capabilities:
            $ref: '#/components/schemas/BaseChannelCapabilities'
            description: What the channel's surface can render. The AI Agent tailors replies to the declared capabilities. Omitted fields default to false. Read-only on native channels, whose capabilities are fixed by the surface.
          metadata:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/CustomChannelMetadata'
            description: 'A dictionary of key, value pairs assigned to the channel. Metadata may not exceed 4KB total.

              - `metadata` keys may only be of type: `string`

              - `metadata` values may only be one of type: `string`, `boolean`, `integer`, or `number` (float)

              '
          created_at:
            type: string
            format: date-time
            description: The date and time the channel was created
        required:
        - type
        - name
        - description
        - modality
        description: custom variant
      - type: object
        properties:
          type:
            $ref: '#/components/schemas/NativeChannelType'
            description: The type of the channel
          id:
            type: string
            description: The channel ID
          name:
            type: string
            description: The name of the channel
          description:
            type: string
            description: A description of the channel
          modality:
            $ref: '#/components/schemas/BaseChannelModality'
            description: The modality of the channel
          capabilities:
            $ref: '#/components/schemas/BaseChannelCapabilities'
            description: What the channel's surface can render. The AI Agent tailors replies to the declared capabilities. Omitted fields default to false. Read-only on native channels, whose capabilities are fixed by the surface.
        required:
        - type
        - name
        - description
        - modality
        description: native variant
      discriminator:
        propertyName: type
      title: Channel
    BaseChannelModality:
      type: string
      enum:
      - messaging
      - email
      - voice
      description: The modality of the channel
      title: BaseChannelModality
    PaginationMetadata:
      type: object
      properties:
        next_page_url:
          type:
          - string
          - 'null'
          description: The URL to the next page of results
      title: PaginationMetadata
    ErrorsErrorsItems:
      type: object
      properties:
        type:
          type: string
          description: The error type
        message:
          type: string
          description: The error message
        details:
          type:
          - string
          - 'null'
          description: Extra information about the error
      required:
      - type
      - message
      title: ErrorsErrorsItems
    UpdateChannelCapabilities:
      type: object
      properties:
        markdown:
          type: boolean
          description: Preserve Markdown (bold, italic, and links) in replies instead of flattening to plain text.
      description: Capabilities to update. Only the fields you include are changed; omitted fields keep their current value.
      title: UpdateChannelCapabilities
    CustomChannelMetadata:
      oneOf:
      - type: string
      - type: boolean
      - type: integer
      - type: number
        format: double
      title: CustomChannelMetadata
    UpdateChannel:
      type: object
      properties:
        capabilities:
          $ref: '#/components/schemas/UpdateChannelCapabilities'
          description: Capabilities to update. Only the fields you include are changed; omitted fields keep their current value.
      required:
      - capabilities
      description: Fields that can be updated on an existing custom channel
      title: UpdateChannel
    CustomChannelType:
      type: string
      enum:
      - custom
      description: The type of the channel
      title: CustomChannelType
    V2ChannelsGetParametersType:
      type: string
      enum:
      - custom
      - native
      title: V2ChannelsGetParametersType
    CustomChannel:
      type: object
      properties:
        id:
          type: string
          format: id
          description: The channel ID
        type:
          $ref: '#/components/schemas/CustomChannelType'
          description: The type of the channel
        name:
          type: string
          description: The name of the channel
        description:
          type: string
          description: A description of the channel
        modality:
          $ref: '#/components/schemas/BaseChannelModality'
          description: The modality of the channel
        capabilities:
          $ref: '#/components/schemas/BaseChannelCapabilities'
          description: What the channel's surface can render. The AI Agent tailors replies to the declared capabilities. Omitted fields default to false. Read-only on native channels, whose capabilities are fixed by the surface.
        metadata:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CustomChannelMetadata'
          description: 'A dictionary of key, value pairs assigned to the channel. Metadata may not exceed 4KB total.

            - `metadata` keys may only be of type: `string`

            - `metadata` values may only be one of type: `string`, `boolean`, `integer`, or `number` (float)

            '
        created_at:
          type: string
          format: date-time
          description: The date and time the channel was created
      required:
      - name
      - description
      - modality
      title: CustomChannel
    Errors:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorsErrorsItems'
          description: A list of errors
      required:
      - errors
      title: Errors
    Channels_getChannels_Response_200:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Channel'
        meta:
          $ref: '#/components/schemas/PaginationMetadata'
      title: Channels_getChannels_Response_200
    V2ChannelsGetParametersModality:
      type: string
      enum:
      - messaging
      - email
      - voice
      title: V2ChannelsGetParametersModality
    BaseChannelCapabilities:
      type: object
      properties:
        markdown:
          type: boolean
          default: false
          description: Preserve Markdown (bold, italic, and links) in replies instead of flattening to plain text.
      description: What the channel's surface can render. The AI Agent tailors replies to the declared capabilities. Omitted fields default to false. Read-only on native channels, whose capabilities are fixed by the surface.
      title: BaseChannelCapabilities
    NativeChannelType:
      type: string
      enum:
      - native
      description: The type of the channel
      title: NativeChannelType
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
