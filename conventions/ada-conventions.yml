method: searched
source: >-
  https://docs.ada.cx/reference/introduction/overview,
  https://docs.ada.cx/reference/introduction/authentication,
  https://docs.ada.cx/reference/introduction/versioning,
  https://docs.ada.cx/reference/introduction/limits,
