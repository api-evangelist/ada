key_flows:
- name: Diagnose a bad conversation
  steps:
  - adacli <instance> conversations search --resolution not-resolved --since 7d
  - adacli <instance> conversations diagnose <conversation-id>
- name: Turn a production conversation into a regression test
  steps:
  - adacli <instance> testing cases from-conversation <conversation-id>
  - adacli <instance> testing runs create
  - adacli <instance> testing runs compare --baseline r1 --candidate r2
- name: Configuration as code
  steps:
  - adacli <instance> snapshot export -o config.json
  - adacli <instance> snapshot diff
  - adacli <instance> snapshot import
- name: Drive the CLI from an agent
  steps:
  - adacli agent-context | jq '.commands | length'
command_count: 213
surface_note: >-
  This CLI reaches roughly four times as many resources as Ada's four public OpenAPI documents —
  glossary, coaching, topics, scorecards, custom metrics, playbooks, proactives, actions, test
  cases/runs, redactions, team, snapshots and analytics all exist here with no published REST
