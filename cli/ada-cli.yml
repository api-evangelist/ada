  `adacli --help` and `adacli agent-context` from the official adacli-v0.4.0 darwin-arm64 release tarball
name: adacli
tagline: Agent-native CLI for managing and improving Ada AI Agents
description: >-
  A standalone binary (no Node runtime required) that drives Ada's management dashboard API — the
  same private surface the MCP server sits on, and a much larger surface than the four public
  REST APIs. 213 commands across 36 groups. Notably it is designed to be driven BY an agent:
  `adacli agent-context` emits a 93 KB machine-readable JSON description of the entire command
  tree, global flags, typed exit codes and the error envelope.
version: 0.4.0
released: '2026-07-03'
license: Proprietary — "AdaCLI License Notice (© Ada Support Inc.)", not an SPDX/open-source licence
repository: https://github.com/AdaSupport/homebrew-tap
docs_in_binary: adacli docs guide | adacli docs claude-code
install:
- method: homebrew
  platforms:
  - macOS arm64
  - macOS x64
  - Linux arm64
  - Linux x64
  command: brew install adasupport/tap/adacli
  upgrade: brew upgrade adacli
- method: scoop
  platforms:
  - Windows x64
  command: scoop bucket add adasupport https://github.com/AdaSupport/homebrew-tap.git && scoop install adacli
  upgrade: scoop update adacli
- method: release-tarball
  url: https://github.com/AdaSupport/homebrew-tap/releases
  note: >-
    Per-arch tarballs attached to tag adacli-v<version>, SHA-256 verified by the formula. macOS
    binaries are ad-hoc signed but not notarized.
usage: adacli <instance> <command> [subcommand] [options]
instance_argument:
  required: true
  description: >-
    Nearly every command takes the Ada instance handle as its first positional argument
    (e.g. `adacli gennie knowledge list`), matching the per-tenant <handle>.ada.support host model.
global_flags:
- flag: --json
  description: JSON output on stdout (auto-on when piped)
- flag: --output <table|json|quiet>
  description: Select output mode
- flag: --quiet, -q
  description: Minimal output (ids only for lists)
- flag: --no-color
  description: Disable ANSI color
- flag: --yes, -y
  description: Skip confirmation prompts
- flag: --version, -V
  description: Output the version number
env_vars:
- name: ADACLI_OUTPUT
  description: table|json|quiet — default output mode
- name: NO_COLOR / FORCE_COLOR
  description: Standard color control
- name: ADACLI_PASSWORD / ADACLI_MFA_CODE
  description: Non-interactive login
- name: ADACLI_NO_UPDATE_CHECK
  description: Silence the update nag
exit_codes:
  '0': OK
  '1': GENERIC
  '2': USAGE
  '3': AUTH
  '4': FORBIDDEN
  '5': NOT_FOUND
  '6': RATE_LIMIT
  '7': READ_ONLY
  '8': NETWORK
error_contract:
  description: >-
    On failure in --json mode a JSON envelope is written to stderr and the process exits with the
    typed code above.
  category_to_exit_code:
    usage: 2
    auth: 3
    forbidden: 4
    not_found: 5
    rate_limit: 6
    read_only: 7
    network: 8
    api: 1
    internal: 1
  example: |
    {
      "error": {
        "code": "SESSION_EXPIRED",
        "category": "auth",
        "message": "Session expired. Please log in again.",
        "exitCode": 3,
        "hint": "Run: adacli <instance> login"
      }
    }
