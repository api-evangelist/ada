source: mcp/ada-mcp.yml, openapi/_original/ada-knowledge-openapi.yml, skills/
docs: https://docs.ada.cx/mcp/tools/overview
summary: >
  Ada's MCP server and Ada's REST APIs are NOT two views of one core. The Platform REST APIs are a
  content/CRM surface (knowledge, end users, conversations, channels, webhooks, integrations); the
  MCP server is an operator surface (metrics, transcripts, coaching, playbooks, test runs, change
  sets) built on Ada's internal management-dashboard API — the same API the adacli binary drives.
  Almost nothing overlaps. Only three MCP tools have a public REST backing, and the twelve most
  valuable MCP tools have no public REST equivalent at all. That divergence is the finding.
