    files:
    - openapi/_original/ada-knowledge-openapi.yml
    - openapi/_original/ada-data-export-openapi.yml
    - openapi/_original/ada-data-export-v1-4-openapi.yml
    - openapi/_original/ada-data-compliance-openapi.yml
    operations: 58
    gated: false
    note: >-
      operationIds are unique only within a tag in the knowledge spec (list/get/create/delete
      repeat), so rows below name the operation as "<tag>.<operationId>".
  mcp:
    url_template: https://<your-ada-instance-domain>/api/mcp
    tools_named: 18
    gated: true
    gate: >-
      Per-tenant host plus OAuth/API-key. tools/list cannot be called anonymously, so no tool
      inherits a live inputSchema here; every binding below is by name and published description.
  mcp_docs:
    url: https://docs.ada.cx/_mcp/server
    tools_named: 1
    gated: false
    note: Anonymous docs-search server; probed 2026-08-14, returned searchDocs with a real inputSchema.
  graphql:
    endpoint: null
    note: >-
      Ada publishes no GraphQL endpoint. graphql/ada-graphql.md in this repo is a conceptual
      description, not a served schema, and is excluded from this crosswalk.
  cli:
    artifact: cli/ada-cli.yml
    commands: 213
    note: >-
      adacli talks to "Ada's management dashboard API" (its own --help text) — the same private
      surface the MCP server exposes. It is the best public evidence of what MCP tools sit on.
crosswalk:
- tool: search_knowledge
  category: knowledge-and-coaching
  rest:
  - knowledge > articles.list
  binding: rest
  confidence: medium
  note: >-
    GET /v2/knowledge/articles/ lists and filters articles; the MCP tool is described as a search
    over the same corpus. Ranking/relevance semantics are not exposed by the REST operation, so
    the mapping is close but not exact.
- tool: list_entities
  category: entity-discovery
  rest:
  - channels.get-channels
  - Variables.list
  - customInstructions.list-custom-instructions
  binding: rest
  confidence: medium
  note: >-
    list_entities fans out across channels, topics, variables, custom metrics, scorecards,
    Playbooks, handoffs, processes, custom instructions and tools. Only three of those entity
    kinds have a public REST list operation; the rest are dashboard-only.
- tool: get_ada_configuration
  category: configuration
  rest:
  - persona.get-persona
  - customInstructions.list-custom-instructions
  binding: rest
  confidence: low
  note: >-
    Partial overlap only. The tool returns playbooks, actions, custom instructions and the
    company description in one call; REST publishes custom instructions and persona, and nothing
    for playbooks or actions.
mcp_only:
- tool: get_ada_metric
  reason: >-
    AR rate, CSAT, containment and engaged-conversation volume are analytics; no public REST
    analytics endpoint exists. Reachable via `adacli analytics summary`.
- tool: get_available_filters
  reason: Describes the conversation-query filter vocabulary of the internal analytics API. No REST equivalent.
- tool: get_conversations
  reason: >-
    Searches conversations by filter across the whole Agent. The public REST
    GET /v2/conversations/{conversation_id}/ fetches ONE conversation by id and cannot search;
    the Data Export API exports by time window, not by filter. `adacli conversations search`.
- tool: get_conversation
  reason: >-
    Returns a full transcript. Closest REST is conversations.fetch-conversation-messages-by-id,
    but that returns raw messages for a custom-channel conversation, not the assembled transcript
    with reasoning that the MCP tool returns. Deliberately not bound.
- tool: search_coaching
  reason: Coaching entries have no public REST resource. `adacli coaching list`.
- tool: get_improvement_guide
  reason: Server-side editorial content (Ada's entity improvement guide). Not a data resource.
- tool: list_glossary_terms
  reason: Glossary has no public REST resource. `adacli glossary list`.
- tool: get_glossary_conflict_guide
  reason: Server-side editorial content.
- tool: get_test_cases
  reason: Simulation test cases have no public REST resource. `adacli testing cases list`.
- tool: get_test_runs
  reason: Test runs have no public REST resource. `adacli testing runs list`.
- tool: get_test_run_quota
  reason: Quota metering for test runs; no public REST resource.
- tool: edit_agent_behavior
  reason: >-
    Composite write across knowledge, coaching, Playbooks, Actions and custom instructions,
    staged on a change set and then promoted/reverted/discarded. No REST change-set primitive
    exists — the REST writes apply immediately and individually.
- tool: edit_agent_config
  reason: >-
    Writes test cases, topics, custom metrics and scorecards and triggers test runs. None of
    those resources are published in REST.
- tool: list_agent_changesets
  reason: Change sets are an MCP-era construct (shipped 2026-08-13); no REST representation.
- tool: send_feedback
  reason: Out-of-band channel to Ada's development team; not an API resource.
- tool: searchDocs
  reason: Documentation search on the docs host. Not a Platform API capability.
