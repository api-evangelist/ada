docs: https://docs.ada.cx/reference/introduction/overview
note: >-
  Derived from $ref graph and id-reference fields across the four published OpenAPI documents
  (206 component schemas, 58 operations). Relationships are read from concrete `*_id` fields in
  the schemas — nothing inferred from naming alone. Ada publishes no id prefixes: identifiers are
  bare 24-character MongoDB-style hex strings (e.g. 5f7e0e2c1e7c7e000f0f9c3a) with no type
  discriminator, so an id alone does not tell a caller what it points at. The one exception is
  webhook endpoints, which carry the Svix `ep_` prefix.
