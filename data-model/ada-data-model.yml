gaps:
  note: >-
    The dashboard data model is far larger than the published one. Glossary terms, coaching
    entries, topics, scorecards, custom metrics, playbooks, proactives, actions, test cases, test
    runs, redaction rules, team users and change sets all exist as first-class entities in the
    CLI and MCP surfaces but have no OpenAPI schema, so they cannot be modelled here. See
    cli/ada-cli.yml and mcp/ada-tool-crosswalk.yml.
