source: https://docs.ada.cx/reference/introduction/limits
url: https://docs.ada.cx/reference/introduction/limits
limit_count: 12
scope: per Ada instance
headers:
  published: true
  response:
  - X-RateLimit-Limit
  - X-RateLimit-Remaining
  - X-RateLimit-Reset
  retry_after: true
  exhaustion_status: 429
  oversize_status: 413
  note: 'Re-read 2026-10-12 (supersedes the 2026-08-14 finding of no headers): every
    /v2/ endpoint and the MCP server return X-RateLimit-* on successful authenticated
    responses, describing the longest window; a rate-limiter 429 carries Retry-After;
    legacy /data_api/v1.x/ endpoints return no rate limit headers.'
notes: 'Ada enforces global rate limits across all REST API families to ensure high
  availability. Individual API families may apply their own elevated or additional
  local limits. Exceeding any limit returns HTTP 429 Too Many Requests. Ada recommends
  implementing retry logic with exponential backoff and jitter. Rate limits were increased
  for the End Users API and Conversations API in March 2026 (doubled from 30,000 to
  60,000 per day).

  '
