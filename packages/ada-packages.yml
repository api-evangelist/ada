source: >-
  https://docs.ada.cx/chat/web/getting-started, https://docs.ada.cx/chat/ios/getting-started,
  https://docs.ada.cx/chat/android/getting-started, https://docs.ada.cx/chat/react-native/getting-started,
  registry.npmjs.org, search.maven.org, github.com/AdaSupport, github.com/ada-cx-public
notes: >
  Ada ships client-side chat/messaging SDKs (Web, iOS, Android, React Native) plus a standalone
  CLI binary. There is NO first-party server-side REST client library for the Platform APIs in
  any language registry — Ada's own docs show raw curl/requests/fetch examples for every REST
  operation. The Android SDK on Maven Central has not shipped a release since 2023-08-18, which
  is the clearest published decay signal in Ada's package surface; the iOS SDK was re-homed to a
  new repo (ada-cx-public/messaging-ios, AdaMessaging) and is current.
